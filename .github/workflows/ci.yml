name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 必须升级到 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci

      - name: Build (Skip Lint for faster deploy)
        run: npm run build
        env:
          # 在构建时注入一个伪造的 DATABASE_URL 以绕过 Prisma 检查
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/db"
          NEXTAUTH_SECRET: "ci-test-secret"

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-5xovm79bminb7wmr.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 自动使用 Git Commit SHA 作为标签，并更新 latest
          tags: |
            crpi-5xovm79bminb7wmr.cn-beijing.personal.cr.aliyuncs.com/comic-db/postgres:latest
            crpi-5xovm79bminb7wmr.cn-beijing.personal.cr.aliyuncs.com/comic-db/postgres:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_SSH_HOST }}
          username: ${{ secrets.ECS_SSH_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/comic-book
            # 更新镜像标签（使用当前 commit sha 或直接用 latest）
            sed -i "s|postgres:v.*|postgres:latest|g" docker-compose.prod.yml
            docker compose --env-file .env.prod pull app
            docker compose --env-file .env.prod up -d app
            docker image prune -f